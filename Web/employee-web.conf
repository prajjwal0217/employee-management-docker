server {

    listen 80;
    server_name employee.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name employee.lab;

    ssl_certificate /etc/nginx/ssl/employee.lab/employee.lab.crt;
    ssl_certificate_key /etc/nginx/ssl/employee.lab/employee.lab.key;

    root /var/www/employee-web/browser;
    index index.html;

    # 1. Serve Angular and support Angular routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Forward API requests to Spring Boot
    location /api/ {
        proxy_pass http://employee-app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}